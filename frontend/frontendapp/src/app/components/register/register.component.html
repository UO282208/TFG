<div class="form-header">
    <h3>Registrarse</h3>
</div>
<hr>
<div class="form-alert">
    <div class="alert alert-danger" role="alert" *ngIf="errorMsg.length">
        <p *ngFor="let msg of errorMsg">{{ msg }}</p>
    </div>
</div>

<div class="form-group">
    <label for="name" class="form-label">Nombre</label>
    <input [(ngModel)]="registerRequest.name" type="text" class="form-control" id="name" placeholder="John Doe">
</div>

<div class="form-group">
    <label for="email" class="form-label">Dirección de Email</label>
    <input [(ngModel)]="registerRequest.email" type="email" class="form-control" id="email" placeholder="name@domain.com">
</div>

<div class="form-group">
    <label for="password" class="form-label">Contraseña</label>
    <input [(ngModel)]="registerRequest.password" type="password" class="form-control" id="password" placeholder="*****">
</div>

<div class="form-actions">
    <button type="button" class="btn btn-primary" (click)="register()" style="margin-right: 5px;">Registrarse</button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">Volver Atrás</button>
</div>

<div class="form-register">
    ¿Ya tienes una cuenta?
    <button type="button" class="btn btn-link" (click)="login()">Iniciar Sesión</button>
</div>
